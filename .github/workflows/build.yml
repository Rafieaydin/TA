name: SonarQube Scan

on:
  push:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix paths in coverage.xml
        run: |
          # Hapus "apps/" dari semua path di coverage.xml
          sed -i 's|apps/||g' coverage.xml
          # Hapus prefix "apps.hrms_custom" di package name
          sed -i 's|apps.hrms_custom|hrms_custom|g' coverage.xml
      
      - uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=hrms_custom
            -Dsonar.exclusions=**/tests/**,**/__pycache_/**