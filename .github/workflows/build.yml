name: SonarQube Scan

on:
  push:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fix paths in coverage.xml
        run: |
          # File ada di subfolder hrms_custom/hrms_custom/
          sed -i 's|apps/||g' hrms_custom/hrms_custom/coverage.xml
          sed -i 's|apps.hrms_custom|hrms_custom|g' hrms_custom/hrms_custom/coverage.xml
      
      - uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=hrms_custom/hrms_custom/coverage.xml
            -Dsonar.sources=hrms_custom
            -Dsonar.exclusions=**/tests/**,**/__pycache_/**