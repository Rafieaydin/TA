name: SonarQube Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_frappe
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('hrms_custom/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Frappe Bench
        run: |
          pip install frappe-bench
      
      - name: Cache Bench
        uses: actions/cache@v4
        with:
          path: frappe-bench
          key: ${{ runner.os }}-bench-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bench-
      
      - name: Initialize Bench
        run: |
          bench init frappe-bench --frappe-branch version-15 --skip-assets
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://localhost:6379
          bench set-config -g redis_queue redis://localhost:6379
          bench set-config -g redis_socketio redis://localhost:6379
      
      - name: Copy app to bench
        run: |
          cd frappe-bench
          mkdir -p apps/hrms_custom
          cp -r ${{ github.workspace }}/hrms_custom/* apps/hrms_custom/
      
      - name: Create site and install app
        run: |
          cd frappe-bench
          bench new-site test_site.local \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test_site.local install-app hrms_custom
      
      - name: Run tests with coverage
        run: |
          cd frappe-bench
          bench --site test_site.local run-tests --app hrms_custom --coverage
      
      - name: Generate coverage.xml
        run: |
          cd frappe-bench
          pip install coverage
          coverage xml -i --data-file=sites/.coverage -o ${{ github.workspace }}/coverage.xml
      
      - name: Upload coverage.xml as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=TA_hrms_custom
            -Dsonar.projectName=TA - HRMS Custom
            -Dsonar.sources=hrms_custom/hrms_custom
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/tests/**,**/__pycache_/**
            -Dsonar.python.version=3.12