name: SonarQube Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  sonar:
    runs-on: ubuntu-latest
    
    services:
      # ✅ Service untuk MariaDB
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: test_frappe
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      # ✅ Service untuk Redis
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            redis-server \
            git \
            curl \
            libmysqlclient-dev \
            libssl-dev \
            pkg-config
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install frappe-bench
        run: |
          pip install frappe-bench
      
      - name: Initialize bench
        run: |
          # Inisialisasi bench tanpa redis (akan pakai service dari GitHub)
          bench init frappe-bench --frappe-branch version-15 --skip-redis-config-generation
          cd frappe-bench
          bench set-config -g db_host localhost
          bench set-config -g redis_cache redis://localhost:6379
          bench set-config -g redis_queue redis://localhost:6379
          bench set-config -g redis_socketio redis://localhost:6379
      
      - name: Install app
        run: |
          cd frappe-bench
          # Copy app ke bench
          mkdir -p apps/hrms_custom
          cp -r ${{ github.workspace }}/hrms_custom apps/
          bench get-app hrms_custom
      
      - name: Create site for testing
        run: |
          cd frappe-bench
          bench new-site test_site.local --db-root-password root --admin-password admin --no-mariadb-socket
          bench --site test_site.local install-app hrms_custom
      
      - name: Run tests with coverage
        run: |
          cd frappe-bench
          bench --site test_site.local run-tests --app hrms_custom --coverage
      
      - name: Generate coverage.xml in hrms_custom folder
        run: |
          cd frappe-bench
          # Install coverage jika belum ada
          pip install coverage
          # Generate coverage.xml di dalam folder app
          coverage xml -i \
            --data-file=sites/.coverage \
            -o apps/hrms_custom/coverage.xml
      
      - name: Upload coverage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frappe-bench/apps/hrms_custom/coverage.xml
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=hrms_custom
            -Dsonar.projectName=HRMS Custom
            -Dsonar.sources=apps/hrms_custom/hrms_custom
            -Dsonar.python.coverage.reportPaths=apps/hrms_custom/coverage.xml
            -Dsonar.exclusions=**/tests/**,**/__pycache_/**
            -Dsonar.python.version=3